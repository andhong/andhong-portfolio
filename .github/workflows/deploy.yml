name: Deploy to GitHub Pages

# Pushing to master does NOT update the live site. Two ways to publish:
#   1. Push master to the `live` branch:  git push origin master:live
#   2. GitHub → Actions → "Deploy to GitHub Pages" → Run workflow
on:
  push:
    branches: [live]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Reuse resized images from earlier builds so only new or changed ones are processed.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/assets/**', 'src/components/Pic.astro', 'package-lock.json') }}
          restore-keys: astro-images-
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages can take a while to process a large upload; the default is 10 minutes.
          timeout: 1800000
